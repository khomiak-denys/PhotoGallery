services:
  api: 
    image: photogallery_api:latest
    container_name: photogallery_api
    ports: 
      - "5000:8080"
    depends_on: 
      - db
      - minio
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - JWT_KEY=${JWT_KEY}
      - JWT_ISSUER=${JWT_ISSUER}
      - JWT_AUDIENCE=${JWT_AUDIENCE}
      - JWT_VALIDITY_MINS=${JWT_VALIDITY_MINS}
      - S3_ENDPOINT=${S3_ENDPOINT:-http://minio:9000}
      - S3_PUBLIC_ENDPOINT=${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      - S3_ACCESS_KEY=${OBJECT_STORAGE_USER}
      - S3_SECRET_KEY=${OBJECT_STORAGE_PASSWORD}
      - S3_BUCKET=${OBJECT_STORAGE_BUCKET}
      - S3_REGION=${S3_REGION}

  migrator:
    image: photogallery_api:migrator
    container_name: photogallery_migrator
    
    command: dotnet ef database update --project src/PhotoGallery.Infrastructure/PhotoGallery.Infrastructure.csproj
    
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
    depends_on:
      - db
    profiles:
      - migrations_tools

  minio:
    image: quay.io/minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${OBJECT_STORAGE_USER}
      - MINIO_ROOT_PASSWORD=${OBJECT_STORAGE_PASSWORD}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      - minio
    entrypoint: ["/bin/sh", "/init/minio-init.sh"]
    environment:
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=${OBJECT_STORAGE_USER}
      - MINIO_SECRET_KEY=${OBJECT_STORAGE_PASSWORD}
      - MINIO_BUCKET=${OBJECT_STORAGE_BUCKET}
    volumes:
      - ./scripts:/init

  db:
    image: postgres:17
    container_name: photogallery_db
    restart: always
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes: 
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
  minio_data:
